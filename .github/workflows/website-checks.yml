name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check docs/site.js
      - name: Test desktop, tablet and phones
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/gamevida-website.log 2>&1 &
          SITE_PID=$!
          trap 'kill "$SITE_PID" || true' EXIT
          node scripts/check-website.cjs
      - name: Retain visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamevida-global-website-review
          path: qa/*.png
          if-no-files-found: warn
